name: Build Pyarrow wheel for ARM

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
  workflow_dispatch:
    inputs:
      arrow_version:
        type: string
        description: Arrow version to build
        required: true
        default: "24.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Building for ${{ inputs.arrow_version || '24.0.0' }} on ${{ matrix.python-version }}
    env:
      ARROW_VERSION: "${{ inputs.arrow_version || '24.0.0' }}"

    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            distro: "bookworm"
          - python-version: "3.13"
            distro: "trixie"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: latest

      - name: Available platforms
        run: echo ${STEPS_BUILDX_OUTPUTS_PLATFORMS}
        env:
          STEPS_BUILDX_OUTPUTS_PLATFORMS: ${{ steps.buildx.outputs.platforms }}

      - name: Build Pyarrow wheels
        run: |
          docker buildx build -f Dockerfile \
            --platform linux/arm/v7 \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            --build-arg DISTRO=${{ matrix.distro }} \
            --build-arg ARROW_VERSION=${ARROW_VERSION} \
            --load \
            -t pyarrow:wheel .

      - name: Extract Wheels from image
        run: |
          docker run --rm -v $(pwd)/assets:/assets \
            --platform linux/arm/v7 \
            pyarrow:wheel \
            cp -r /build/arrow/python/dist /assets/

      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyarrow-wheels-${{ matrix.python-version }}
          path: ./assets/dist/

  combine:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: pyarrow_wheels
          pattern: pyarrow-wheels-*
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyarrow-wheels-combined
          path: pyarrow_wheels/

name: Build Pyarrow wheel for ARM

on:
  # Only build on workflow dispatch.
  # push:
  #   branches:
  #     - main
  #     - ci/*
  # pull_request:
  workflow_dispatch:
    inputs:
      arrow_version:
        type: string
        description: Arrow version to build
        required: true
        default: "24.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Building for ${{ inputs.arrow_version || '24.0.0' }} on ${{ matrix.python-version }}
    env:
      ARROW_VERSION: "${{ inputs.arrow_version || '24.0.0' }}"

    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            distro: "bookworm"
          - python-version: "3.13"
            distro: "trixie"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: latest

      - name: Available platforms
        run: echo ${STEPS_BUILDX_OUTPUTS_PLATFORMS}
        env:
          STEPS_BUILDX_OUTPUTS_PLATFORMS: ${{ steps.buildx.outputs.platforms }}

      - name: Build Pyarrow wheels
        run: |
          docker buildx build -f Dockerfile \
            --platform linux/arm/v7 \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            --build-arg DISTRO=${{ matrix.distro }} \
            --build-arg ARROW_VERSION=${ARROW_VERSION} \
            --load \
            -t pyarrow:wheel .

      - name: Extract Wheels from image
        run: |
          docker run --rm -v $(pwd)/assets:/assets \
            --platform linux/arm/v7 \
            pyarrow:wheel \
            cp -r /build/arrow/python/dist /assets/

      - name: Archive artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyarrow-wheels-${{ matrix.python-version }}
          path: ./assets/dist/

  combine:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pyarrow_wheels
          pattern: pyarrow-wheels-*
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyarrow-wheels-combined
          path: pyarrow_wheels/
